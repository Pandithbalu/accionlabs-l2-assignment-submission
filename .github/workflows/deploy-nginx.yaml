name: Build, Scan & Deploy Nginx to Kubernetes

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: nginx-app
  IMAGE_TAG: 1.19
  REGISTRY: docker.io
  DOCKER_REPO: ${{ secrets.DOCKER_USERNAME }}/nginx-app

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ env.DOCKER_REPO }}:${{ env.IMAGE_TAG }}

    - name: Scan Docker Image for Vulnerabilities (Trivy)
      uses: aquasecurity/trivy-action@v0.13.0
      with:
        image-ref: ${{ env.DOCKER_REPO }}:${{ env.IMAGE_TAG }}
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true

    - name: Set up Kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG_DATA }}" > ~/.kube/config

    - name: Deploy to Kubernetes Cluster
      run: |
        kubectl apply -f k8s/service.yaml
        kubectl apply -f k8s/statefulset.yaml

    - name: Verify Deployment Status
      run: |
        kubectl rollout status statefulset/nginx-statefulset
